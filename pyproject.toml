[project]
name = "mlkit"
version = "0.2.0"
description = "Personal ML engineering and MLOps toolkit for building reusable machine learning solutions and continuously evolving production-grade practices."
readme = "README.md"
license = "MIT"
# fixing to earlier verison, as required packages are not compatible with newer versions
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    # Temporary pin required because uv resolves kaleido 0.2.1.post1,
    # which currently lacks a compatible wheel for Linux x86_64.
    "kaleido==0.2.1",
    "matplotlib>=3.10",
    "mlflow>=3.17.2",
    "nannyml>=0.13.1",
    "optuna>=5.0.0",
    # NannyML 0.13.1 passes inplace=False, deprecated in pandas 3.1.
    "pandas>=3.0.5,<3.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.0",
    # MLflow 3.18 uses SQLAlchemy's noload strategy, deprecated in 2.1.
    "sqlalchemy>=2.0,<2.1",
    # NannyML imports statsmodels as part of its monitoring package.
    "statsmodels>=0.15.0",
    "uvicorn>=0.53.0",
]

[project.optional-dependencies]
datasets = [
    "ucimlrepo>=0.0.7",
]

[project.scripts]
mlkit = "mlkit:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["use_cases"]

[tool.uv.sources]
mlkit-use-cases = { workspace = true }

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "dvc>=3.67.1",
    # Required by Starlette's TestClient used in serving tests.
    "httpx2>=2.16.0",
    "pip-licenses>=5.5.5",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "mlkit-use-cases",
]
notebooks = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "jupyterlab>=4.6.3",
    "seaborn>=0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "use_cases/tests"]
addopts = [
    "--import-mode=importlib",
    "--cov=src/mlkit",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "unit: fast isolated tests",
    "smoke: quick integration tests",
    "integration: end-to-end workflow tests",
    "usecase: isolated tests for use-cases",
]

[tool.coverage.report]
precision = 2
